# Written by rhizome (ContainerSetup); docs/byoh/NO_KVM.md section 4.2.
lxc.include = /usr/share/lxc/config/common.conf
lxc.include = /usr/share/lxc/config/userns.conf
lxc.arch = linux64
lxc.uts.name = vmcont01
lxc.rootfs.path = dir:/var/storage/vmcont01/0/rootfs
lxc.idmap = u 0 1000196608 65536
lxc.idmap = g 0 1000196608 65536
lxc.apparmor.profile = lxc-container-default-cgns
lxc.apparmor.allow_nesting = 0
lxc.seccomp.profile = /var/lib/ubicloud/lxc/vmcont01/seccomp
lxc.cap.drop =
lxc.cap.drop = mac_admin mac_override sys_time sys_module sys_rawio
lxc.mount.auto =
lxc.mount.auto = proc:mixed sys:mixed cgroup:rw:force
lxc.mount.entry = /var/lib/ubicloud/lxc/vmcont01/seed var/lib/cloud/seed/nocloud none ro,bind,create=dir 0 0
lxc.cgroup.dir.monitor = system.slice/vmcont01.service/lxc.monitor
lxc.cgroup.dir.container = system.slice/vmcont01.service/lxc.payload
lxc.cgroup2.cpu.max = 200000 100000
lxc.cgroup2.memory.max = 8G
lxc.cgroup2.memory.swap.max = 0
lxc.cgroup2.pids.max = 4096
lxc.console.logfile = /var/lib/ubicloud/lxc/vmcont01/console.log
lxc.console.size = 4MB
lxc.console.rotate = 1
lxc.init.cmd = /sbin/init
lxc.net.0.type = veth
lxc.net.0.veth.pair = nccont01
lxc.net.0.name = eth0
lxc.net.0.hwaddr = 52:54:00:12:34:56
lxc.net.0.flags = up
lxc.net.0.script.up = /var/lib/ubicloud/lxc/vmcont01/net-up
